media:
  input: images
  output: /images
  path: images
  rename: true
  categories:
    - image
settings:
  hide: true
  content:
    merge: true
content:
  - name: pages
    label: Pages
    path: pages
    type: collection
    subfolders: false
    view:
      fields:
        - meta_title
      primary: meta_title
      sort:
        - meta_title
    fields:
      - { name: header_text, type: string, label: Header Text }
      - { name: title, type: string, label: Title }
      - { name: subtitle, type: string, label: Subtitle }
      - { name: meta_title, type: string, label: Meta Title, maxlength: 55 }
      - name: meta_description
        type: string
        label: Meta Description
        maxlength: 155
      - { name: layout, type: string, label: Layout }
      - { name: permalink, type: string, label: Permalink }
      - { name: no_index, type: boolean, label: No Index }
      - { name: pagefind_body, type: boolean, label: Pagefind Body }
      - { name: navigationParent, type: string, label: Navigation Parent }
      - name: eleventyNavigation
        label: Navigation
        type: object
        fields:
          - { name: key, type: string }
          - { name: order, type: number }
      - name: blocks
        label: Content Blocks
        type: block
        list: true
        blockKey: type
        blocks:
          - name: image-background
            label: Image Background
            fields:
              - { name: image, type: image, label: Hero Image }
              - { name: image_alt, type: string, label: Image Alt Text }
              - { name: content, type: rich-text, label: Hero Content }
              - { name: container_width, type: select, label: Container Width, options: { values: [default, full] } }
              - { name: parallax, type: boolean, label: Parallax }
          - name: markdown
            label: Markdown
            fields:
              - { name: header_intro, type: rich-text, label: Header Intro }
              - { name: content, type: rich-text, label: Content }
          - name: split
            label: Split
            fields:
              - { name: title, type: string, label: Title }
              - { name: subtitle, type: string, label: Subtitle }
              - { name: content, type: rich-text, label: Content }
              - name: figure_type
                type: string
                label: Figure Type (image, video, code, html)
              - { name: figure_src, type: image, label: Figure Image }
              - { name: figure_alt, type: string, label: Figure Alt Text }
              - { name: figure_caption, type: string, label: Figure Caption }
              - name: figure_video_id
                type: string
                label: Figure Video ID or URL
              - name: figure_filename
                type: string
                label: Figure Code Filename
              - { name: figure_code, type: string, label: Figure Code Content }
              - name: figure_language
                type: string
                label: Figure Code Language
              - name: figure_html
                type: rich-text
                label: Figure HTML Content
              - { name: reverse, type: boolean, label: Reverse Layout }
          - name: features
            label: Features
            fields:
              - { name: header_intro, type: rich-text, label: Header Intro }
              - name: items
                type: array
                label: Features
                fields:
                  - { name: icon, type: string, label: Icon }
                  - { name: title, type: string, label: Title }
                  - { name: description, type: string, label: Description }
          - name: image-cards
            label: Image Cards
            fields:
              - { name: header_intro, type: rich-text, label: Header Intro }
              - name: image_aspect_ratio
                type: string
                label: Image Aspect Ratio
              - name: items
                type: array
                label: Cards
                fields:
                  - { name: image, type: image, label: Image }
                  - { name: title, type: string, label: Title }
                  - { name: description, type: string, label: Description }
                  - { name: link, type: string, label: Link }
          - name: contact_form
            label: Contact Form
            fields:
              - { name: header_intro, type: rich-text, label: Header Intro }
              - { name: content, type: rich-text, label: Introduction Text }
          - name: items
            label: Items
            fields:
              - { name: collection, type: string, label: Collection }
              - { name: header_intro, type: rich-text, label: Header Intro }
              - { name: header_align, type: string, label: Header Align }
              - { name: intro, type: rich-text, label: Intro }
          - name: cta
            label: Cta
            fields:
              - { name: title, type: string, label: Title }
              - { name: description, type: string, label: Description }
              - name: button
                type: object
                label: Button
                fields:
                  - { name: text, type: string, label: Text }
                  - { name: href, type: string, label: URL }
      - { name: body, type: rich-text, label: Body }
      - name: faqs
        label: FAQs
        type: object
        list: true
        fields:
          - { name: question, type: string, label: Question, required: true }
          - { name: answer, type: string, label: Answer, required: true }
      - name: gallery
        type: image
        label: Gallery
        options:
          multiple: true
  - name: snippets
    label: Snippets
    path: snippets
    type: collection
    subfolders: false
    filename: "{primary}.md"
    fields:
      - { name: name, type: string, label: Name }
      - { name: body, type: rich-text, label: Body }
  - name: team
    label: Team
    path: team
    type: collection
    subfolders: false
    filename: "{primary}.md"
    fields:
      - { name: title, type: string, label: Title }
      - { name: thumbnail, type: image, label: Thumbnail }
      - { name: snippet, type: string, label: Role }
      - { name: image, type: image, label: Profile Image }
      - { name: body, type: rich-text, label: Biography }
      - name: faqs
        label: FAQs
        type: object
        list: true
        fields:
          - { name: question, type: string, label: Question, required: true }
          - { name: answer, type: string, label: Answer, required: true }
      - name: gallery
        type: image
        label: Gallery
        options:
          multiple: true
  - name: reviews
    label: Reviews
    path: reviews
    type: collection
    subfolders: false
    fields:
      - { name: name, type: string, label: Name }
      - { name: url, type: string, label: URL }
      - { name: rating, type: number, label: Rating }
      - { name: thumbnail, type: image, label: Reviewer Photo }
      - { name: body, type: rich-text, label: Body }
      - name: faqs
        label: FAQs
        type: object
        list: true
        fields:
          - { name: question, type: string, label: Question, required: true }
          - { name: answer, type: string, label: Answer, required: true }
  - name: locations
    label: Locations
    path: locations
    type: collection
    subfolders: true
    filename: "{primary}.md"
    view:
      fields:
        - thumbnail
        - title
        - subtitle
      primary: title
      sort:
        - title
    fields:
      - { name: title, type: string, label: Title }
      - { name: subtitle, type: string, label: Subtitle }
      - { name: thumbnail, type: image, label: Thumbnail }
      - { name: order, type: number, label: Order }
      - { name: body, type: rich-text, label: Body }
      - { name: meta_title, type: string, label: Meta Title, maxlength: 55 }
      - name: meta_description
        type: string
        label: Meta Description
        maxlength: 155
      - name: faqs
        label: FAQs
        type: object
        list: true
        fields:
          - { name: question, type: string, label: Question, required: true }
          - { name: answer, type: string, label: Answer, required: true }
      - name: gallery
        type: image
        label: Gallery
        options:
          multiple: true
  - name: properties
    label: Properties
    path: properties
    type: collection
    subfolders: false
    filename: "{primary}.md"
    view:
      fields:
        - thumbnail
        - title
        - subtitle
        - bedrooms
        - sleeps
      primary: title
      sort:
        - title
    fields:
      - { name: title, type: string, label: Title }
      - { name: subtitle, type: string, label: Subtitle }
      - { name: thumbnail, type: image, label: Thumbnail }
      - { name: order, type: number, label: Order }
      - { name: featured, type: boolean, label: Featured }
      - name: locations
        label: Locations
        type: reference
        options:
          collection: locations
          multiple: true
          search: title
          value: "{path}"
          label: "{title}"
      - { name: bedrooms, type: number, label: Bedrooms }
      - { name: bathrooms, type: number, label: Bathrooms }
      - { name: sleeps, type: number, label: Sleeps }
      - { name: price_per_night, type: number, label: Price Per Night }
      - { name: features, type: string, label: Features, list: true }
      - { name: body, type: rich-text, label: Body }
      - { name: meta_title, type: string, label: Meta Title, maxlength: 55 }
      - name: meta_description
        type: string
        label: Meta Description
        maxlength: 155
      - name: faqs
        label: FAQs
        type: object
        list: true
        fields:
          - { name: question, type: string, label: Question, required: true }
          - { name: answer, type: string, label: Answer, required: true }
      - name: gallery
        type: image
        label: Gallery
        options:
          multiple: true
      - name: specs
        label: Specifications
        type: object
        list: true
        fields:
          - { name: name, type: string, label: Name, required: true }
          - { name: value, type: string, label: Value, required: true }
      - name: tabs
        label: Tabs
        type: object
        list: true
        fields:
          - { name: title, type: string, label: Title, required: true }
          - { name: image, type: image, label: Image }
          - { name: body, type: rich-text, label: Body, required: true }
  - name: guide-categories
    label: Guide Categories
    path: guide-categories
    type: collection
    subfolders: false
    filename: "{primary}.md"
    fields:
      - { name: title, type: string, label: Title }
      - { name: subtitle, type: string, label: Subtitle }
      - { name: order, type: number, label: Order }
      - { name: icon, type: image, label: Icon }
      - name: property
        label: Property
        type: reference
        options:
          collection: properties
          multiple: false
          search: title
          value: "{path}"
          label: "{title}"
      - { name: body, type: rich-text, label: Body }
      - name: faqs
        label: FAQs
        type: object
        list: true
        fields:
          - { name: question, type: string, label: Question, required: true }
          - { name: answer, type: string, label: Answer, required: true }
  - name: guide-pages
    label: Guide Pages
    path: guide-pages
    type: collection
    subfolders: true
    filename: "{primary}.md"
    fields:
      - { name: title, type: string, label: Title }
      - { name: subtitle, type: string, label: Subtitle }
      - name: guide-category
        label: Guide Category
        type: reference
        options:
          collection: guide-categories
          multiple: false
          search: title
          value: "{path}"
          label: "{title}"
      - { name: order, type: number, label: Order }
      - { name: body, type: rich-text, label: Body }
      - name: faqs
        label: FAQs
        type: object
        list: true
        fields:
          - { name: question, type: string, label: Question, required: true }
          - { name: answer, type: string, label: Answer, required: true }
      - name: gallery
        type: image
        label: Gallery
        options:
          multiple: true
  - name: page-local-events
    label: Local Events Page
    type: file
    path: events/local-events.md
    fields:
      - { name: meta_title, type: string, label: Meta Title, maxlength: 55 }
      - name: meta_description
        type: string
        label: Meta Description
        maxlength: 155
      - name: blocks
        label: Content Blocks
        type: block
        list: true
        blockKey: type
        blocks:
          - name: markdown
            label: Markdown
            fields:
              - { name: header_intro, type: rich-text, label: Header Intro }
              - { name: content, type: rich-text, label: Content }
          - name: cta
            label: Cta
            fields:
              - { name: title, type: string, label: Title }
              - { name: description, type: string, label: Description }
              - name: button
                type: object
                label: Button
                fields:
                  - { name: text, type: string, label: Text }
                  - { name: href, type: string, label: URL }
      - { name: body, type: rich-text, label: Body }
  - name: homepage
    label: Homepage Settings
    type: file
    path: _data/homepage.json
    fields:
      - name: show_products
        type: boolean
        label: Show Products Section
        default: true
      - name: show_menus
        type: boolean
        label: Show Menus Section
        default: true
      - name: show_news
        type: boolean
        label: Show News Section
        default: true
      - name: show_recurring_events
        type: boolean
        label: Show Recurring Events
        default: true
  - name: site
    label: Site Configuration
    type: file
    path: _data/site.json
    fields:
      - { name: name, type: string, label: Site Name }
      - { name: url, type: string, label: Site URL }
      - name: opening_times
        label: Opening Times
        type: object
        list: true
        fields:
          - { name: day, type: string, label: Day, required: true }
          - { name: hours, type: string, label: Hours, required: true }
      - name: socials
        label: Social Media Links
        type: object
        fields:
          - { name: Github, type: string, label: Github }
          - { name: Forgejo, type: string, label: Forgejo }
          - { name: Facebook, type: string, label: Facebook }
          - { name: Instagram, type: string, label: Instagram }
          - { name: TikTok, type: string, label: TikTok }
          - { name: Google, type: string, label: Google }
          - { name: WhatsApp, type: string, label: WhatsApp }
          - { name: RSS, type: string, label: RSS }
      - { name: map_embed_src, type: string, label: Map Embed URL }
  - name: meta
    label: Meta Configuration
    type: file
    path: _data/meta.json
    fields:
      - { name: language, type: string, label: Language Code, default: en-GB }
      - name: organization
        label: Organization
        type: object
        fields:
          - { name: description, type: string, label: Organization Description }
          - { name: legalName, type: string, label: Legal Name }
          - { name: foundingDate, type: string, label: Founding Date }
          - name: founders
            label: Founders
            type: object
            list: true
            fields:
              - { name: name, type: string, label: Name }
          - name: address
            label: Address
            type: object
            fields:
              - { name: streetAddress, type: string, label: Street Address }
              - { name: addressLocality, type: string, label: City }
              - { name: addressRegion, type: string, label: Region/State }
              - { name: postalCode, type: string, label: Postal Code }
              - { name: addressCountry, type: string, label: Country Code }
          - name: contactPoint
            label: Contact Points
            type: object
            list: true
            fields:
              - { name: telephone, type: string, label: Telephone }
              - { name: contactType, type: string, label: Contact Type }
              - { name: areaServed, type: string, label: Area Served }
              - name: availableLanguage
                type: string
                label: Available Languages
                list: true
  - name: map-places
    label: Map Places
    type: file
    path: _data/map_places.json
    fields:
      - name: places
        label: Places
        type: object
        list: true
        fields:
          - { name: title, type: string, label: Title }
          - { name: description, type: string, label: Description }
          - name: category
            type: select
            label: Category
            options:
              values:
                - { value: bank, label: Bank }
                - { value: beaches, label: Beaches }
                - { value: bike_rental, label: Bike rentals }
                - { value: coffee_shop, label: Coffee shops }
                - { value: electric_charging_station, label: Electric charging point }
                - { value: entertainment_and_activities, label: Entertainment and activities }
                - { value: events, label: Events }
                - { value: farm_shop_market, label: Farm shop/farmers market }
                - { value: fitness_exercise, label: Fitness/exercise }
                - { value: gas_station, label: Gas/petrol station }
                - { value: gastro_pub, label: Gastropubs }
                - { value: grocery_shopping, label: Grocery shopping }
                - { value: horse_riding, label: Horse riding }
                - { value: museums, label: Museums }
                - { value: other, label: Other }
                - { value: pharmacy, label: Pharmacy }
                - { value: retail_therapy, label: Retail shops/stores }
                - { value: souvenirs, label: Souvenirs }
                - { value: take_out, label: Take out/away }
                - { value: taxi, label: Taxi rank }
                - { value: train, label: Train station }
                - { value: vehicle_repair, label: Vehicle/auto repair }
          - name: location
            type: object
            label: Location
            fields:
              - { name: lat, type: number, label: Latitude }
              - { name: lng, type: number, label: Longitude }
          - name: w3w
            type: string
            label: what3words
            comment: "three word address e.g. filled.count.soap"
  - name: alt-tags
    label: Image Alt Tags
    type: file
    path: _data/alt-tags.json
    fields:
      - name: images
        type: object
        list: true
        fields:
          - { name: path, type: image, label: Image }
          - { name: alt, type: string, label: Alt Text }
