    subfolders: false
    filename: "{primary}.md"
    fields:
      - { name: title, type: string, label: Title }
      - { name: subtitle, type: string, label: Subtitle }
      - { name: order, type: number, label: Order }
      - { name: icon, type: image, label: Icon }
      - name: property
        label: Property
        type: reference
        options:
          collection: properties
          multiple: false
          search: title
          value: "{path}"
          label: "{title}"
      - { name: body, type: rich-text, label: Body }
      - name: faqs
        label: FAQs
        type: object
        list: true
        fields:
          - { name: question, type: string, label: Question, required: true }
          - { name: answer, type: string, label: Answer, required: true }
  - name: guide-pages
