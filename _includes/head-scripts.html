<link rel="icon" href="/assets/icons/sheep.svg" type="image/svg+xml" />

<meta property="og:title" content="{{ title | default: site.name }}" />
<meta property="og:type" content="website" />
<meta property="og:url" content="{{ site.url }}{{ page.url }}" />
<meta property="og:image" content="{{ site.url }}/assets/social-share.jpg" />
<meta property="og:image:alt" content="Holiday cottage in Garsdale with views over the Yorkshire Dales" />
<meta property="og:site_name" content="{{ site.name }}" />
<meta property="og:description" content="{{ description | default: site.name }}" />

<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{ title | default: site.name }}" />
<meta name="twitter:description" content="{{ description | default: site.name }}" />
<meta name="twitter:image" content="{{ site.url }}/assets/social-share.jpg" />

<script
  data-goatcounter="https://analytics.garsdalecottages.co.uk/count"
  async
  src="https://analytics.garsdalecottages.co.uk/count.js"
></script>
